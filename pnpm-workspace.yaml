packages:
  - apps/*
  - games/*
  - packages/*

engineStrict: true
savePrefix: ''
# Supply-chain guard: never resolve a version published less than 7 days ago (minutes).
minimumReleaseAge: 10080

# Dependency install scripts are blocked unless listed. Prisma downloads its schema engine
# (needed by `prisma migrate`); esbuild verifies its platform binary.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  # Install-time telemetry pulled in by swagger-ui-dist; never run it.
  '@scarf/scarf': false

# Security overrides for transitive dependencies. Remove each once the parent ships the fix.
overrides:
  # GHSA-7589-6fvf-x4pw (high, ReDoS) via prisma > @prisma/config > effect.
  effect: 3.22.4
